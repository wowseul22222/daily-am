name: CGV Wangsimni Assassins GV Watch

on:
  workflow_dispatch:
  schedule:
    # GitHub cron은 UTC.
    # KST 05:57에 미리 시작해서 Python이 06:00까지 대기.
    - cron: "57 20 * * *"  # KST 05:57

    # KST 기준 5시간 간격, 모두 :13에 새 실행
    - cron: "13 21 * * *"  # KST 06:13
    - cron: "13 2 * * *"   # KST 11:13
    - cron: "13 7 * * *"   # KST 16:13
    - cron: "13 12 * * *"  # KST 21:13

permissions:
  contents: write

concurrency:
  group: cgv-wangsimni-assassins-gv-watch
  # 수동 실행이든 이전 예약 실행이든, 새 실행이 시작되면 즉시 기존 실행 취소.
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Set monitoring duration
        id: duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 수동 실행도 길게 유지. 다음 예약 실행이 들어오면 concurrency가 끊고 교체.
            echo "seconds=21600" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "57 20 * * *")
                # 05:57 시작 → Python이 06:00부터 감시 → 06:13 실행이 들어오면 교체
                echo "seconds=3600" >> "$GITHUB_OUTPUT"
                ;;
              "13 21 * * *"|"13 2 * * *"|"13 7 * * *"|"13 12 * * *")
                # 6시간 여유를 주고, 실제 교체는 다음 :13 실행이 시작될 때 수행
                echo "seconds=21600" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "seconds=21600" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Run target GV watch
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: python -u cgv_wangsimni_assassins_gv.py

      - name: Save alert state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cgv_wangsimni_assassins_gv_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update Wangsimni Assassins GV watch state"
            git pull --rebase
            git push
          fi
